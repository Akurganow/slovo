included:
  - Package.swift
  - Sources
  - Tests
  - Tools

excluded:
  - .build
  - .swiftpm
  - Tests/GateChecksTests/Fixtures

strict: true
lenient: false
check_for_updates: false
allow_zero_lintable_files: false
reporter: xcode

# Policy: start from SwiftLint strict mode with all opt-in/analyzer rules, then
# disable rules that create high churn or conflict with the repo's existing
# Swift/API style. Re-enable a disabled rule only with a focused cleanup pass.
disabled_rules:
  # Formatting/layout preferences with low bug-prevention value for this repo.
  - anonymous_argument_in_multiline_closure
  - contrasted_opening_brace
  - conditional_returns_on_newline
  - indentation_width
  - let_var_whitespace
  - multiline_arguments
  - multiline_arguments_brackets
  - multiline_call_arguments
  - multiline_function_chains
  - sorted_enum_cases
  - sorted_imports
  - switch_case_on_newline
  - trailing_closure
  - trailing_comma
  - type_contents_order
  - vertical_whitespace_between_cases
  - vertical_whitespace_opening_braces

  # Explicitness/documentation rules that would require a broad, non-behavioral
  # rewrite before they become useful prevention gates.
  - explicit_acl
  - explicit_enum_raw_value
  - explicit_self
  - explicit_top_level_acl
  - explicit_type_interface
  - file_name
  - file_types_order
  - missing_docs
  - one_declaration_per_file
  - required_deinit
  - strict_fileprivate

  # Style rules where the current project conventions are clearer than the
  # blanket rule.
  - async_without_await
  - discouraged_default_parameter
  - discouraged_optional_collection
  - force_unwrapping
  - function_default_parameter_at_end
  - inclusive_language
  - large_tuple
  - nesting
  - no_extension_access_modifier
  - no_empty_block
  - no_grouping_extension
  - no_magic_numbers
  - non_overridable_class_declaration
  - optional_data_string_conversion
  - pattern_matching_keywords
  - prefer_condition_list
  - prefer_self_in_static_references
  - prefixed_toplevel_constant
  - redundant_self
  - static_over_final_class
  - unneeded_throws_rethrows
  - unused_enumerated
  - unused_parameter
  - variable_shadowing

opt_in_rules:
  - all

analyzer_rules:
  - all

cyclomatic_complexity:
  warning: 20
  error: 30

function_body_length:
  warning: 80
  error: 120

identifier_name:
  excluded:
    - ac
    - c
    - c1
    - c2
    - db
    - e
    - en
    - fn
    - i
    - id
    - on
    - op
    - p5
    - p7
    - p9
    - r
    - ru
    - s
    - s1
    - s2
    - t
    - t1
    - t2
    - t3
    - up

line_length:
  warning: 160
  error: 220

type_body_length:
  warning: 400
  error: 600

file_length:
  # Count code mass, not documentation — the house style is comment-dense.
  ignore_comment_only_lines: true

# Generator residue that a regex can name, so it never reaches main. The
# catalogue behind these rules, and what stays a judgment call for a
# reviewer, is `.agents/rules/slop.md`. Syntax-kind filters keep the
# comment rules out of string literals; CI is strict, so a warning fails.
custom_rules:
  slop_hedging_comment:
    name: "Hedging comment"
    regex: '(?i)\b(should work|for now|just in case|hopefully|not sure|probably fine|quick fix|temporary fix|temporarily)\b'
    match_kinds: [comment, doccomment]
    message: "A comment that hedges records a doubt instead of a fact: resolve it or state the invariant."
    severity: warning

  slop_changelog_comment:
    name: "Changelog in a comment"
    regex: '(?i)\b(updated to|previously,|changed from|refactored to|renamed from|moved from|as requested|as discussed|this (PR|commit|change) (adds|fixes|removes|updates|introduces))\b'
    match_kinds: [comment, doccomment]
    message: "History lives in git; a comment describes the code as it is, not the change that produced it."
    severity: warning

  slop_narrator_comment:
    name: "Narrating comment"
    regex: "^\\s*//(?!/)\\s*(Now|Here|Next|Then|Finally|Let's|Let us|We) (we |can |need |just |simply |will )"
    match_kinds: [comment]
    message: "A comment that narrates the next line adds no information; delete it or state why."
    severity: warning

  slop_section_banner:
    name: "Section banner"
    regex: '//\s*[-=*#]{5,}'
    match_kinds: [comment]
    message: "Decorative separators are a generator habit; use MARK or nothing."
    severity: warning

  slop_attribution_comment:
    name: "Tool attribution in source"
    regex: '\b(Generated (by|with)|Co-authored-by|ChatGPT|Copilot|Codex)\b'
    match_kinds: [comment, doccomment]
    message: "Attribution belongs in the commit trailer, never in the source."
    severity: warning

  slop_versioned_name:
    name: "Versioned or filler declaration name"
    regex: '\b(class|struct|enum|actor|protocol|typealias|func)\s+\w+(V2|_v2|_new|New|Impl|Helper|Utils|Util|Manager)\b'
    match_kinds: [keyword, identifier, typeidentifier]
    message: "V2/New/Impl/Helper/Utils/Manager say nothing about the job; name the thing."
    severity: warning

  slop_vague_error_string:
    name: "Vague error string"
    regex: '(Something went wrong|An error occurred|Unknown error occurred)'
    match_kinds: [string]
    message: "An error string names what failed."
    severity: warning

  slop_print_leftover:
    name: "print() in app code"
    included: "Sources/(SlovoCore|slovo)/.*\\.swift"
    regex: '^\s*print\('
    match_kinds: [identifier]
    message: "App code logs through the logger; print() is a debugging leftover."
    severity: warning
