name: Release

# CI-native release automation. Every push to `main` runs this one pipeline, which
# itself decides — from the conventional commits since the last release tag —
# whether a release is due:
#
#   * releasable commits (feat / fix / perf / breaking) -> compute the next semver
#     with git-cliff, stamp it into Info.plist, build, sign, notarize, staple,
#     verify, then commit the version bump, tag `v<version>`, and publish a GitHub
#     Release with the stapled DMG and app zip.
#   * nothing releasable (docs / chore / ci only) -> the run is trunk verification:
#     it still tests and packages a signed artifact under a unique dev stamp, but
#     creates no tag and no release.
#
# Humans never run release commands, edit versions, or push tags — the pipeline is
# the only path. The publish job pushes the bump commit and tag over SSH with a
# write-access deploy key: deploy keys bypass the `main` ruleset's pull-request
# rule, and the GITHUB_TOKEN (the GitHub Actions app) does not. A deploy-key push does
# start workflow runs. `[skip ci]` in the bump commit skips every push-triggered
# workflow, and no workflow triggers on tags, so the release completes in a single
# run and needs no PAT. There is no standalone `tags: v*` trigger: tags are created
# by this pipeline, so a second, tag-triggered packaging run can never double-fire.
#
# Never runs on pull_request: fork PRs get no secrets, and packaging must never be
# exposed to untrusted code. Signing secrets live in the protected `release`
# environment and are reachable only from the packaging job. The deploy key lives
# alone in the `release-push` environment and is reachable only from the publish job.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Least privilege by default; only the publish job is granted contents: write, and
# it holds no signing secrets.
permissions:
  contents: read

env:
  # One pin for both jobs that run git-cliff: decide computes the version, publish
  # writes the changelog section, and both must read the same rules the same way.
  # Moving it is verified by the replay in docs/release-ci.md.
  GIT_CLIFF: git-cliff@2.14.2

concurrency:
  # Do not cancel a release once it starts mutating state. A newer push to main may
  # still supersede an in-flight run during its `test` phase (the reusable gate has
  # its own cancel-in-progress group), but that is before any commit/tag/release, so
  # no partial publish can result. Queued runs re-decide against the tag the prior
  # run created.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Single source of the test gate: the reusable workflow that also guards PRs.
  test:
    uses: ./.github/workflows/swift.yml

  # Decide whether a release is due and, if so, compute the next version — both from
  # one git-cliff answer (cliff.toml holds the rules). Holds no secrets and only
  # reads the checkout, so it runs on the cheaper Linux runner.
  decide:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # git-cliff reports `bump_type` null when no commit since the last tag moves
      # the version; that is the whole "nothing to release" decision. Naming the
      # three bumps keeps an empty or garbled value from reading as a release.
      releasable: ${{ contains(fromJSON('["major","minor","patch"]'), steps.bump.outputs.bump_type) }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: git-cliff reads the last v* tag as the version
          # anchor and classifies every commit after it.
          fetch-depth: 0
      - name: Install git-cliff
        # The commit pin fixes the action's own code. The action checks the
        # git-cliff archive's SHA-256.
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: ${{ env.GIT_CLIFF }}
      - name: Compute the next release version
        id: bump
        run: |
          set -euo pipefail
          context="$(git-cliff --bump --context)"
          # `.[0]` is the unreleased range when something bumps, else the last tag.
          # The tag carries a `v`; the stamp script and the tag step add their own.
          jq -r '.[0] | "bump_type=\(.bump_type)", "version=\(.version | ltrimstr("v"))"' \
            <<<"$context" | tee -a "$GITHUB_OUTPUT"

  package:
    needs: [ test, decide ]
    runs-on: macos-26
    timeout-minutes: 60
    # Signing secrets are scoped to this protected environment.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the CFBundleVersion build number (git rev-list --count)
          # is deterministic and monotonic.
          fetch-depth: 0
      - name: Stamp the app version
        env:
          RELEASABLE: ${{ needs.decide.outputs.releasable }}
          RELEASE_VERSION: ${{ needs.decide.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          build_number="$(git rev-list --count HEAD)"
          if [ "$RELEASABLE" = "true" ]; then
            # Real release: the computed marketing version + a monotonic build number.
            Scripts/stamp-app-version.sh "$RELEASE_VERSION" "$build_number"
          else
            # Trunk verification: a unique, run-scoped dev stamp that never
            # masquerades as a released build (marked short version + run-number
            # CFBundleVersion). No tag or release is created for this artifact.
            current="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)"
            Scripts/stamp-app-version.sh "${current}-ci.${RUN_NUMBER}" "$RUN_NUMBER"
          fi
      - name: Toolchain
        id: toolchain
        run: |
          set -euo pipefail
          swift --version
          xcodebuild -version
          # The cache key takes this value, so it must be one line without commas.
          xcode_version="$(xcodebuild -version | paste -sd ' ' - | tr -d ',')"
          echo "xcode_version=${xcode_version}" >> "$GITHUB_OUTPUT"
      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Deliberately excludes .build/dist so a restored cache never carries a
          # stale signed bundle into a fresh packaging run.
          path: |
            .build/checkouts
            .build/repositories
            .build/artifacts
            .build/release
          key: ${{ runner.os }}-release-spm-${{ steps.toolchain.outputs.xcode_version }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-release-spm-${{ steps.toolchain.outputs.xcode_version }}-
      - name: Import Developer ID signing certificate
        env:
          DEVELOPER_ID_APP_P12_BASE64: ${{ secrets.DEVELOPER_ID_APP_P12_BASE64 }}
          DEVELOPER_ID_APP_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APP_P12_PASSWORD }}
        run: Scripts/import-signing-certificate.sh
      - name: Build, sign, notarize, and staple the app and DMG
        env:
          SIGNING_IDENTITY: "Developer ID Application: Alexander Kurganov (ZN8H5SF4R7)"
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          NOTARY_KEY_P8="$RUNNER_TEMP/asc_api_key.p8"
          trap 'rm -f "$NOTARY_KEY_P8"' EXIT
          export NOTARY_KEY_P8
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$NOTARY_KEY_P8"
          Scripts/sign-and-notarize.sh app
          xcrun stapler staple .build/dist/Slovo.app
          Scripts/sign-and-notarize.sh dmg
          xcrun stapler staple .build/dist/Slovo.dmg
          # Release asset must contain the STAPLED app, so re-zip after stapling.
          ditto -c -k --keepParent .build/dist/Slovo.app .build/dist/Slovo.zip
      - name: Verify signing, notarization, and stapling
        run: |
          set -euo pipefail
          app=".build/dist/Slovo.app"
          dmg=".build/dist/Slovo.dmg"
          codesign --verify --strict --deep --verbose=2 "$app"
          codesign --verify --verbose=2 "$dmg"
          info="$(codesign --display --verbose=4 "$app" 2>&1)"
          echo "$info"
          echo "$info" | grep -q "Identifier=com.slovo.app"
          echo "$info" | grep -q "TeamIdentifier=ZN8H5SF4R7"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
          spctl --assess --type execute -vv "$app"
      - name: Generate the Sparkle appcast
        # Only a real release has a version for the version-pinned enclosure URL;
        # trunk-verification runs skip this (same releasable gate as version stamping).
        if: needs.decide.outputs.releasable == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          # EdDSA private key via a temp file (same pattern as the notary .p8),
          # removed on exit; it stays in this job and never reaches publish.
          ed_key_file="$RUNNER_TEMP/sparkle_ed_private_key"
          trap 'rm -f "$ed_key_file"' EXIT
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$ed_key_file"
          # Feed generate_appcast a directory holding ONLY the release DMG, so the
          # sibling Slovo.zip is never treated as a second update archive.
          appcast_dir="$RUNNER_TEMP/appcast"
          mkdir -p "$appcast_dir"
          cp .build/dist/Slovo.dmg "$appcast_dir/"
          .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file "$ed_key_file" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${RELEASE_VERSION}/" \
            "$appcast_dir"
          cp "$appcast_dir/appcast.xml" .build/dist/appcast.xml
      - name: Upload signed artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slovo-macos
          # appcast.xml is present only on releasable runs; upload-artifact errors
          # only when the whole set is empty, so the dmg/zip keep trunk runs valid.
          path: |
            .build/dist/Slovo.dmg
            .build/dist/Slovo.zip
            .build/dist/appcast.xml
          if-no-files-found: error

  publish:
    needs: [ decide, package ]
    # Only a run that decided a release is due publishes. Write access is isolated
    # to this job, which holds no signing secrets (nor the EdDSA appcast key — it
    # only attaches the appcast.xml the package job already generated). It MUST run
    # on macOS: the
    # version stamp goes through the repo's single stamping script, which uses
    # Apple userland (PlistBuddy, plutil) so the committed plist can never drift
    # from the packaged one — a Linux runner has neither tool (exit 127).
    if: needs.decide.outputs.releasable == 'true'
    runs-on: macos-26
    timeout-minutes: 15
    # Holds only the deploy key; the signing secrets stay in `release`.
    environment: release-push
    permissions:
      contents: write
    steps:
      # Before the keyed checkout, so no action from outside GitHub runs with
      # the deploy key on disk.
      - name: Install git-cliff
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: ${{ env.GIT_CLIFF }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the committed CFBundleVersion matches the packaged one
          # deterministically.
          fetch-depth: 0
          # persist-credentials (default) keeps the key in the git config, so the
          # bump commit and tag push over SSH as the deploy key. gh release create
          # below stays on GITHUB_TOKEN: creating a release is not a branch push.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - name: Check whether the release tag already exists
        id: tag
        env:
          RELEASE_VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            # The tag is this run's bump only if its parent is the packaged commit.
            if [ "$(git rev-parse "${tag}^")" != "$GITHUB_SHA" ]; then
              echo "::error::${tag} exists, but its parent is not ${GITHUB_SHA}, the commit this run packaged"
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download signed artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: slovo-macos
          path: dist
      - name: Stamp the release version and write its changelog section
        if: steps.tag.outputs.exists == 'false'
        env:
          RELEASE_VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          build_number="$(git rev-list --count HEAD)"
          Scripts/stamp-app-version.sh "$RELEASE_VERSION" "$build_number"
          git-cliff --unreleased --tag "v${RELEASE_VERSION}" --prepend CHANGELOG.md
      - name: Commit, tag, and push the release bump
        if: steps.tag.outputs.exists == 'false'
        env:
          RELEASE_VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Resources/Info.plist CHANGELOG.md
          git commit -m "chore(release): v${RELEASE_VERSION} [skip ci]"
          git tag "v${RELEASE_VERSION}"
          # One atomic push of the bump commit and its tag. git v2.56.1,
          # Documentation/git-push.adoc: "Either all refs are updated, or on error,
          # no refs are updated." A refused push, such as a moved main, leaves no tag.
          git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "v${RELEASE_VERSION}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          # Already published by an earlier attempt: nothing left to create.
          if [ "$(gh release view "v${RELEASE_VERSION}" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "false" ]; then
            echo "v${RELEASE_VERSION} is already published."
            exit 0
          fi
          # Set explicitly: a re-run of an older release must not take Latest from a newer one.
          latest=--latest=false
          if [ "$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)" = "v${RELEASE_VERSION}" ]; then
            latest=--latest
          fi
          gh release create "v${RELEASE_VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v${RELEASE_VERSION}" \
            --generate-notes \
            --verify-tag \
            "$latest" \
            dist/Slovo.dmg dist/Slovo.zip dist/appcast.xml
