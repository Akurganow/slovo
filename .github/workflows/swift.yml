name: Swift

# Reusable gate: the same `Scripts/diagnose.sh` a contributor runs before
# opening a pull request, so CI and the local gate cannot drift apart. Pull
# requests into main run it directly; the release pipeline (release.yml) and the
# dev build (dev-build.yml) call it via workflow_call before they build and sign
# the app, so every packaged trunk build and every tagged release is gated by it.
on:
  pull_request:
    branches: [ "main" ]
  workflow_call:

# Least privilege: the test job only reads the checkout.
permissions:
  contents: read

# Supersede an in-progress run when the same ref gets a newer push (frees the
# macOS runner the newer push needs).
concurrency:
  # Group by calling workflow AND ref. As a reusable workflow this must not
  # share a concurrency group with its caller (release.yml / dev-build.yml),
  # nor may two different callers on the same ref cancel each other — a
  # dev-build's test call must never cancel the PR gate on the same merge ref,
  # or a release's test phase on main. Inside a reusable run github.workflow
  # resolves to the CALLER's workflow name, so each caller gets its own per-ref
  # group while superseded runs of the same caller still cancel.
  group: swift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The app floor is macOS 15, but the gate runs on macOS 26 only: Swift 6.3
    # (required by Package.swift) ships in Xcode 26.4+, which Apple gates at
    # macOS 26.2, so no macOS 15 runner can install the required Xcode; a
    # standalone swift.org toolchain was ruled out to keep the gate on the
    # stock Xcode toolchain. Runtime on the floor is verified by hand — see
    # docs/development.md, "Manual macOS 15 floor check".
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        id: toolchain
        run: |
          set -euo pipefail
          swift --version
          xcodebuild -version
          xcode-select -p
          # The cache key takes this value, so it must be one line without commas.
          xcode_version="$(xcodebuild -version | paste -sd ' ' - | tr -d ',')"
          echo "xcode_version=${xcode_version}" >> "$GITHUB_OUTPUT"
      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          # The Xcode build string busts the cache when the runner image changes the
          # toolchain; Package.resolved busts it when dependencies change.
          key: ${{ runner.os }}-spm-${{ steps.toolchain.outputs.xcode_version }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ steps.toolchain.outputs.xcode_version }}-
      - name: Run the full gate
        # Build, tests, the cleanup-benchmark CLI smoke check, and every
        # Scripts/lint.sh stage (explicit-import check, shell syntax, plist
        # lint, strict SwiftLint, `swiftlint analyze` over a compiler log).
        # Stages never fail fast: the complete failure set is printed at the end.
        run: Scripts/diagnose.sh
      - name: Prove the test gate can fail
        # The gate-integrity probe records a failure only when armed; assert the
        # armed run exits non-zero so a no-op gate would be caught here, not shipped.
        env:
          SLOVO_GATE_SELFTEST: red
        run: |
          if swift test --disable-automatic-resolution --filter gateGoesRedWhenSelfTestArmed; then
            echo "::error::armed gate-integrity self-test passed — the test gate may be a no-op"
            exit 1
          fi
          echo "armed gate-integrity self-test failed as expected — the gate can go red"
      # SPIKE (never merged): the steps below measure whether a test target can
      # depend on the slovo executable target. They run after the gate.
      - name: "Spike: import check over the test targets"
        if: github.event_name == 'pull_request'
        run: swift build --disable-automatic-resolution --build-tests --explicit-target-dependency-import-check error
      - name: "Spike: rebuild time of the shell files, base manifest and spike manifest"
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          timed_rebuild() {
            for run in 1 2; do
              git ls-files -z 'Sources/slovo/*.swift' | xargs -0 touch
              /usr/bin/time -p swift build --disable-automatic-resolution --build-tests > "$RUNNER_TEMP/build.log" 2> "$RUNNER_TEMP/time.txt" || { cat "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/time.txt"; exit 1; }
              echo "SPIKE TIME native $1 run $run: $(grep '^real' "$RUNNER_TEMP/time.txt")"
            done
          }
          timed_rebuild "spike-manifest"
          git fetch --depth=1 origin "$BASE_REF"
          git show FETCH_HEAD:Package.swift > Package.swift
          mv Tests/SlovoAppTests "$RUNNER_TEMP/SlovoAppTests"
          swift build --disable-automatic-resolution --build-tests
          timed_rebuild "base-manifest"
          git checkout -- Package.swift
          mv "$RUNNER_TEMP/SlovoAppTests" Tests/SlovoAppTests

  # SPIKE (never merged): the same probes under the build system the gate does not
  # use. The gate's toolchain defaults to the native build system; Swift Build is
  # measured on the newest installed Xcode whose Swift is 6.4 or newer.
  spike-swiftbuild:
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Spike: choose an Xcode with Swift 6.4 or newer"
        id: xcode
        run: |
          set -euo pipefail
          chosen=""
          best=0
          for app in /Applications/Xcode*.app; do
            dev="$app/Contents/Developer"
            line=$(DEVELOPER_DIR="$dev" xcrun swift --version 2>/dev/null | grep -o 'Swift version [0-9][0-9]*\.[0-9][0-9]*' | head -1 || true)
            echo "SPIKE XCODE $app: ${line:-no swift}"
            [ -n "$line" ] || continue
            version=${line#Swift version }
            score=$(( ${version%%.*} * 100 + ${version#*.} ))
            if [ "$score" -ge 604 ] && [ "$score" -gt "$best" ]; then
              best=$score
              chosen=$dev
            fi
          done
          if [ -z "$chosen" ]; then
            echo "SPIKE: no Xcode with Swift 6.4 or newer on this runner; criterion 7 not run"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "DEVELOPER_DIR=$chosen" >> "$GITHUB_ENV"
          echo "found=true" >> "$GITHUB_OUTPUT"
      - name: "Spike: toolchain"
        if: steps.xcode.outputs.found == 'true'
        run: |
          set -euo pipefail
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"
          swift --version
          xcodebuild -version
          xcode-select -p
          xcrun --find swift
      - name: "Spike: swift test under Swift Build"
        if: steps.xcode.outputs.found == 'true'
        run: /usr/bin/time -p swift test --disable-automatic-resolution --build-system swiftbuild
      - name: "Spike: the armed self-test goes red under Swift Build"
        if: steps.xcode.outputs.found == 'true'
        env:
          SLOVO_GATE_SELFTEST: red
        run: |
          if swift test --disable-automatic-resolution --build-system swiftbuild --filter gateGoesRedWhenSelfTestArmed; then
            echo "::error::armed self-test passed under Swift Build"
            exit 1
          fi
          echo "SPIKE: armed self-test failed as expected under Swift Build"
      - name: "Spike: import check over the test targets under Swift Build"
        if: steps.xcode.outputs.found == 'true'
        run: swift build --disable-automatic-resolution --build-system swiftbuild --build-tests --explicit-target-dependency-import-check error
      - name: "Spike: rebuild time of the shell files under Swift Build, base manifest and spike manifest"
        if: steps.xcode.outputs.found == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          timed_rebuild() {
            for run in 1 2; do
              git ls-files -z 'Sources/slovo/*.swift' | xargs -0 touch
              /usr/bin/time -p swift build --disable-automatic-resolution --build-system swiftbuild --build-tests > "$RUNNER_TEMP/build.log" 2> "$RUNNER_TEMP/time.txt" || { cat "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/time.txt"; exit 1; }
              echo "SPIKE TIME swiftbuild $1 run $run: $(grep '^real' "$RUNNER_TEMP/time.txt")"
            done
          }
          timed_rebuild "spike-manifest"
          git fetch --depth=1 origin "$BASE_REF"
          git show FETCH_HEAD:Package.swift > Package.swift
          mv Tests/SlovoAppTests "$RUNNER_TEMP/SlovoAppTests"
          swift build --disable-automatic-resolution --build-system swiftbuild --build-tests
          timed_rebuild "base-manifest"
          git checkout -- Package.swift
          mv "$RUNNER_TEMP/SlovoAppTests" Tests/SlovoAppTests
