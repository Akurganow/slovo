name: Swift

# Reusable gate: the same `Scripts/diagnose.sh` a contributor runs before
# opening a pull request, so CI and the local gate cannot drift apart. Pull
# requests into main run it directly; the release pipeline (release.yml) and the
# dev build (dev-build.yml) call it via workflow_call before they build and sign
# the app, so every packaged trunk build and every tagged release is gated by it.
on:
  pull_request:
    branches: [ "main" ]
  workflow_call:

# Least privilege: the test job only reads the checkout.
permissions:
  contents: read

# Supersede an in-progress run when the same ref gets a newer push (frees the
# macOS runner the newer push needs).
concurrency:
  # Group by calling workflow AND ref. As a reusable workflow this must not
  # share a concurrency group with its caller (release.yml / dev-build.yml),
  # nor may two different callers on the same ref cancel each other — a
  # dev-build's test call must never cancel the PR gate on the same merge ref,
  # or a release's test phase on main. Inside a reusable run github.workflow
  # resolves to the CALLER's workflow name, so each caller gets its own per-ref
  # group while superseded runs of the same caller still cancel.
  group: swift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The app floor is macOS 15, but the gate runs on macOS 26 only: Swift 6.3
    # (required by Package.swift) ships in Xcode 26.4+, which Apple gates at
    # macOS 26.2, so no macOS 15 runner can install the required Xcode; a
    # standalone swift.org toolchain was ruled out to keep the gate on the
    # stock Xcode toolchain. Runtime on the floor is verified by hand — see
    # docs/development.md, "Manual macOS 15 floor check".
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        id: toolchain
        run: |
          set -euo pipefail
          swift --version
          xcodebuild -version
          # The cache key takes this value, so it must be one line without commas.
          xcode_version="$(xcodebuild -version | paste -sd ' ' - | tr -d ',')"
          echo "xcode_version=${xcode_version}" >> "$GITHUB_OUTPUT"
      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          # The Xcode build string busts the cache when the runner image changes the
          # toolchain; Package.resolved busts it when dependencies change.
          key: ${{ runner.os }}-spm-${{ steps.toolchain.outputs.xcode_version }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ steps.toolchain.outputs.xcode_version }}-
      - name: Run the full gate
        # Build, tests, the cleanup-benchmark CLI smoke check, and every
        # Scripts/lint.sh stage (explicit-import check, shell syntax, plist
        # lint, strict SwiftLint, `swiftlint analyze` over a compiler log).
        # Stages never fail fast: the complete failure set is printed at the end.
        run: Scripts/diagnose.sh
      - name: Prove the test gate can fail
        # The gate-integrity probe records a failure only when armed; assert the
        # armed run exits non-zero so a no-op gate would be caught here, not shipped.
        env:
          SLOVO_GATE_SELFTEST: red
        run: |
          if swift test --disable-automatic-resolution --filter gateGoesRedWhenSelfTestArmed; then
            echo "::error::armed gate-integrity self-test passed — the test gate may be a no-op"
            exit 1
          fi
          echo "armed gate-integrity self-test failed as expected — the gate can go red"
