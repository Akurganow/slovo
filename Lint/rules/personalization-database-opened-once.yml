id: personalization-database-opened-once
language: swift
severity: error
message: >-
  The personalization database opens once per launch, as the default value of
  the `personalization` parameter of `AppDelegate.init`, and is injected from
  there. `makeLive`, `startPipeline` and Settings run again on every rebuild or
  edit, so open the database nowhere else.
rule:
  any:
    - kind: call_expression
      has:
        kind: navigation_expression
        regex: ^PersonalizationDatabase\.open$
      not:
        inside:
          kind: function_declaration
          stopBy: end
          has:
            field: name
            regex: ^openPersonalization$
    - kind: call_expression
      has:
        any:
          - kind: simple_identifier
            regex: ^openPersonalization$
          - kind: navigation_expression
            regex: \.openPersonalization$
      not:
        all:
          - inside:
              kind: init_declaration
          - follows:
              kind: parameter
              stopBy:
                kind: parameter
              has:
                kind: simple_identifier
                field: name
                regex: ^personalization$
files:
  - Sources/slovo/**/*.swift
