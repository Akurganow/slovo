id: keychain-presence-reads-no-secret
language: swift
severity: error
message: >-
  Checking that a key exists must never read the secret, because a secret read
  at launch can raise a Keychain prompt. `makeLive` takes key presence from
  the state it is handed, and `keychainItemExists` asks for attributes only;
  remove the `hasConfiguredKey` or `apiKey()` read in `makeLive`, and the
  `keychainKey(` or `kSecReturnData` use in `keychainItemExists`.
rule:
  any:
    - kind: simple_identifier
      regex: ^hasConfiguredKey$
      inside:
        kind: function_declaration
        stopBy: end
        has:
          field: name
          regex: ^makeLive$
    - kind: call_expression
      has:
        any:
          - kind: simple_identifier
            regex: ^apiKey$
          - kind: navigation_expression
            regex: \.apiKey$
      inside:
        kind: function_declaration
        stopBy: end
        has:
          field: name
          regex: ^makeLive$
    - kind: simple_identifier
      regex: ^(keychainKey|kSecReturnData)$
      inside:
        kind: function_declaration
        stopBy: end
        has:
          field: name
          regex: ^keychainItemExists$
files:
  - Sources/slovo/AppComposition.swift
  - Sources/SlovoCore/Cleaner/KeychainOpenRouterKeyProvider.swift
